# ============================================================
#  ag — Agent Gateway 注册表
#  统一管理本机所有 AI coding agent 的启动方式
# ============================================================
#  这个文件就是全部配置。加一个 agent = 加一个 [[agent]] 块，保存即生效。
#
#  两种加法：
#    1) 命令行向导：  ag add
#    2) 直接在这里加一个 [[agent]] 块
#
#  字段说明：
#    id       必填，唯一短名，就是 `ag <id>` 敲的那个
#    name     显示名
#    cmd      必填，可执行文件（名字或绝对路径）
#    args     固定参数（启动时永远带上）
#    desc     一句话说明，选择器里显示
#    tags     标签，方便搜索（空格分隔的数组）
#    env      额外环境变量，形如 { KEY = "VALUE" }
#    cwd      启动目录，支持 ~
#    alias    额外别名，`ag <alias>` 也能启动
#    install  安装命令，`ag install <id>` 会执行它
#    hidden   true 则不在选择器里显示（仍可 ag <id> 直接启动）
#
#  不想要某条？  ag rm <id>      （只删那一块，注释会保留）
#  想改？        ag edit
# ============================================================

# ---------- 1. DeepSeek Harness ----------
[[agent]]
id = "d"
name = "DeepSeek Harness"
cmd = "dsh-tui"
desc = "DeepSeek 官方 harness TUI"
tags = ["deepseek", "official"]
alias = ["dsh"]
install = "npm i -g @deepseek-ai/dsh"

[[agent]]
id = "dsh-web"
name = "DeepSeek Harness (Web)"
cmd = "dsh"
args = ["web"]
desc = "DeepSeek harness 网页模式"
tags = ["deepseek", "official", "web"]

