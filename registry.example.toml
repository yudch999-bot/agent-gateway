# ---------- 7. OpenClaw（主会话 + 8 个专职 session）----------
# 这一段同时演示了 args 的用法：同一个 openclaw 二进制，靠不同的
# --session 参数分出 9 个互不干扰的入口。你自己的多会话工具也这么写。
[[agent]]
id = "ot"
name = "OpenClaw · main 总编辑"
cmd = "openclaw"
args = ["tui", "--session", "agent:main:main"]
desc = "主 agent / 总编辑"
tags = ["openclaw", "team"]
alias = ["openclaw"]
install = "npm i -g openclaw@latest"

